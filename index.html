<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acargames — Android Games & Apps</title>
<meta name="description" content="Acargames: sürüş, korku ve simülasyon oyunları ve uygulamaları geliştiren bağımsız Android stüdyosu.">
<meta property="og:title" content="Acargames">
<meta property="og:type" content="website">
<meta property="og:image" content="https://sedopezo21.github.io/banner.jpg">
<style>
:root{
  --bg:#060b18; --bg-2:#0c1324;
  --glass:rgba(255,255,255,.05); --glass-border:rgba(255,255,255,.09);
  --ink:#f0f2f8; --ink-dim:#7a8ba8;
  --cyan:#00f5d4; --purple:#7b2ff7; --amber:#f5a623; --pink:#ff6b9d; --red:#ff3b3b; --lilac:#a78bfa; --teal:#00c9a7;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;
  color:var(--ink); background:var(--bg);
  background-image:
    radial-gradient(600px 400px at 15% -10%, rgba(123,47,247,.28), transparent 70%),
    radial-gradient(500px 400px at 100% 10%, rgba(0,245,212,.16), transparent 70%);
  background-attachment:fixed;
  display:flex; justify-content:center; padding:32px 16px 24px;
  -webkit-font-smoothing:antialiased;
}
.wrap{width:100%;max-width:520px}

/* Üst bar */
header{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.logo{
  width:48px;height:48px;border-radius:22.5%;flex:none;
  background:linear-gradient(135deg,var(--cyan),var(--purple));
  display:grid;place-items:center;font-weight:800;font-size:24px;color:#fff;
  box-shadow:0 6px 18px rgba(123,47,247,.35), inset 0 1px 0 rgba(255,255,255,.35);
}
.brand h1{font-size:20px;font-weight:700;letter-spacing:-.02em}
.brand p{font-size:13px;color:var(--ink-dim)}
.lang{margin-left:auto;display:flex;background:var(--glass);border:1px solid var(--glass-border);border-radius:999px;padding:3px}
.lang button{all:unset;cursor:pointer;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;color:var(--ink-dim)}
.lang button.on{background:rgba(255,255,255,.12);color:var(--ink)}

.tag{font-size:15px;line-height:1.5;color:var(--ink-dim);margin-bottom:24px}
.tag b{color:var(--ink);font-weight:600}

/* Ana ekran ızgarası */
.screen{
  background:var(--glass);border:1px solid var(--glass-border);border-radius:28px;
  padding:20px 12px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 8px}
.app{text-decoration:none;color:inherit;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.icon{
  width:62px;height:62px;border-radius:22.5%;position:relative;overflow:hidden;
  display:grid;place-items:center;
  box-shadow:0 4px 12px rgba(0,0,0,.35);
  transition:transform .2s ease;
}
.icon::after{ /* hafif cam parlaklığı */
  content:"";position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 50%);
  pointer-events:none;
}
.icon svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;position:relative;z-index:1}
.icon img{width:100%;height:100%;object-fit:cover}
.app:hover .icon{transform:translateY(-3px) scale(1.05)}
.app span{font-size:11px;line-height:1.25;color:var(--ink);max-width:76px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Renkler */
.g1{background-image:linear-gradient(135deg,var(--cyan),var(--purple),var(--pink),var(--cyan))}
.g4{background-image:linear-gradient(135deg,var(--teal),var(--cyan),var(--purple),var(--teal))}
.g6{background-image:linear-gradient(135deg,var(--pink),var(--amber),var(--red),var(--pink))}
.g7{background-image:linear-gradient(135deg,var(--lilac),var(--purple),var(--cyan),var(--lilac))}

/* Hareketli renkler */
.icon{background-size:300% 300%;animation:flow 7s ease-in-out infinite}
@keyframes flow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.app:hover .icon{box-shadow:0 8px 24px rgba(0,245,212,.35)}
@media (prefers-reduced-motion:reduce){.icon{animation:none}}

footer{margin-top:22px;text-align:center;font-size:12px;color:var(--ink-dim)}
footer a{color:var(--ink-dim);text-decoration:none}
footer a:hover{color:var(--cyan)}

@media (max-width:380px){
  .icon{width:56px;height:56px}
  .grid{gap:18px 4px}
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo" aria-hidden="true">A</div>
    <div class="brand">
      <h1>Acargames</h1>
      <p data-tr="Android oyun & uygulama stüdyosu" data-en="Android games & apps studio">Android oyun & uygulama stüdyosu</p>
    </div>
    <div class="lang" role="group" aria-label="Dil">
      <button class="on" data-lang="tr">TR</button>
      <button data-lang="en">EN</button>
    </div>
  </header>

  <p class="tag"
     data-tr="<b>Modern tasarım, yenilikçi oynanış.</b> Sürüş, drift, korku ve simülasyon oyunları."
     data-en="<b>Modern design, innovative gameplay.</b> Driving, drift, horror and simulation games."><b>Modern tasarım, yenilikçi oynanış.</b> Sürüş, drift, korku ve simülasyon oyunları.</p>

  <main class="screen">
    <nav class="grid">
      <a class="app" href="https://play.google.com/store/apps/dev?id=5437785091123773517" target="_blank" rel="noopener">
        <div class="icon g4"><svg viewBox="0 0 24 24"><path d="M6 3.5v17l14-8.5z"/></svg></div><span>Google Play</span></a>
      <a class="app" href="mailto:sedatacar@mail.com">
        <div class="icon g1"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6.5L12 13l8.5-6.5"/></svg></div><span data-tr="İletişim" data-en="Contact">İletişim</span></a>
      <a class="app" href="https://acargamess.blogspot.com/" target="_blank" rel="noopener">
        <div class="icon g6"><svg viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/></svg></div><span>Blog</span></a>
      <a class="app" href="https://sedopezo21.github.io/privacy.html">
        <div class="icon g7"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8.5-7 10-4-1.5-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg></div><span data-tr="Gizlilik" data-en="Privacy">Gizlilik</span></a>
    </nav>
  </main>

  <footer>
    <a href="https://sedopezo21.github.io/app-ads.txt">app-ads.txt</a> · © 2025 Acar Games and Apps
  </footer>
</div>

<script>
document.querySelectorAll('.lang button').forEach(function(b){
  b.addEventListener('click',function(){
    var l=b.dataset.lang;
    document.documentElement.lang=l;
    document.querySelectorAll('.lang button').forEach(function(x){x.classList.toggle('on',x===b)});
    document.querySelectorAll('[data-'+l+']').forEach(function(el){el.innerHTML=el.dataset[l]});
  });
});

/* Her butona rastgele renk ve zamanlama */
(function(){
  var c=['#00f5d4','#7b2ff7','#f5a623','#ff6b9d','#ff3b3b','#a78bfa','#00c9a7'];
  function r(a,b){return a+Math.random()*(b-a)}
  function pick(n){var p=c.slice().sort(function(){return Math.random()-.5});return p.slice(0,n)}
  document.querySelectorAll('.icon').forEach(function(el){
    var p=pick(3);
    el.style.backgroundImage='linear-gradient('+Math.round(r(0,360))+'deg,'+p[0]+','+p[1]+','+p[2]+','+p[0]+')';
    var f=r(5,11).toFixed(1);
    el.style.animationDuration=f+'s';
    el.style.animationDelay='-'+r(0,f).toFixed(1)+'s';
  });
})();
</script>
</body>
</html>
